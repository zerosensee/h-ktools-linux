name: Release

# Публикация релиза:
#   • вручную: Actions → Release → Run workflow (версия берётся из src/HKTools.Core/AppInfo.cs)
#   • автоматически: git push origin vX.Y.Z[-suffix]
# Версии с дефисом (2.0.0-alpha.1, 2.1.0-rc.1) публикуются как пре-релиз.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Отметить как пре-релиз (ранняя версия)"
        type: boolean
        default: true
      recreate:
        description: "Удалить существующий релиз и тег с этим номером и создать заново"
        type: boolean
        default: false
      title_suffix:
        description: "Добавка к названию релиза (например «C# / .NET»)"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Системные пакеты
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libgtk-4-1 libadwaita-1-0 adwaita-icon-theme \
            ffmpeg mkvtoolnix xvfb xauth fonts-dejavu-core fontconfig
      - name: Версия
        id: v
        run: echo "version=$(grep -oP 'Version = "\K[^"]+' src/HKTools.Core/AppInfo.cs)" >> "$GITHUB_OUTPUT"
      - name: Сборка и проверки
        run: |
          make build
          make test
          bash .github/scripts/make-sample.sh /tmp/kt
          bash .github/scripts/cli-test.sh /tmp/kt
          export XDG_CONFIG_HOME=/tmp/gui/cfg XDG_CACHE_HOME=/tmp/gui/cache XDG_STATE_HOME=/tmp/gui/state XDG_RUNTIME_DIR=/tmp/gui/run HKTOOLS_SAMPLE=/tmp/kt/sample.mkv
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          timeout 300 make smoke
      - name: Переносимый архив
        run: |
          V=${{ steps.v.outputs.version }}
          D=hktools-$V-linux
          mkdir -p "dist/$D"
          cp -r build/hktools "dist/$D/lib"
          cp -r data "dist/$D/data"
          cp packaging/portable/install.sh LICENSE NOTICE.md README.md CHANGELOG.md "dist/$D/"
          tar -C dist -czf "dist/$D.tar.gz" "$D"
          rm -rf "dist/$D"
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/*.tar.gz

  arch-package:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    container: archlinux:latest
    steps:
      - name: Подготовка Arch
        run: |
          pacman -Syu --noconfirm --needed base-devel git dotnet-sdk-8.0 gtk4 libadwaita ffmpeg make
          useradd -m builder
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg --nodeps --noconfirm
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  release:
    needs: [build, arch-package]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Тег
        id: v
        run: |
          VERSION=${{ needs.build.outputs.version }}
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          PRE=false
          if [[ "$VERSION" == *-* ]] || [ "${{ inputs.prerelease }}" = "true" ]; then PRE=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"
      - name: Исходники
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="hktools-${{ steps.v.outputs.version }}/" -o "dist/hktools-${{ steps.v.outputs.version }}-source.tar.gz" HEAD
      - uses: actions/download-artifact@v4
        with:
          name: portable
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: arch-package
          path: dist
      - name: Контрольные суммы
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/${{ steps.v.outputs.tag }}.md"
          [ -f "$NOTES" ] || NOTES=CHANGELOG.md
          FLAGS=()
          if [ "${{ steps.v.outputs.pre }}" = "true" ]; then FLAGS+=(--prerelease); fi
          if [ "${{ inputs.recreate }}" = "true" ]; then
            gh release delete "${{ steps.v.outputs.tag }}" --cleanup-tag -y || true
            git push origin --delete "refs/tags/${{ steps.v.outputs.tag }}" 2>/dev/null || true
          fi
          TITLE="hktools ${{ steps.v.outputs.version }}"
          if [ -n "${{ inputs.title_suffix }}" ]; then TITLE="$TITLE — ${{ inputs.title_suffix }}"; fi
          if [ "${{ steps.v.outputs.pre }}" = "true" ]; then TITLE="$TITLE (ранняя версия)"; fi
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.v.outputs.tag }}" dist/* --clobber
          else
            gh release create "${{ steps.v.outputs.tag }}" dist/* --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file "$NOTES" "${FLAGS[@]}"
          fi
