# hktools — правила для Hyprland 0.53 / 0.54 (hyprlang, ~/.config/hypr/hyprland.conf)
# Подключение:  source = ~/.config/hypr/hktools.conf
# Для Hyprland 0.55+ (Lua-конфиг) используйте hktools.lua.

# Запуск по Super+Shift+K
bind = SUPER SHIFT, K, exec, hktools

# Окна графика битрейта и синхронизации по осциллограмме — плавающие, по центру
windowrule = float on, center on, size 1200 640, match:class ^(io\.github\.zerosensee\.HKTools)$, match:title ^(Битрейт.*|Синхронизация по осциллограмме)$

# Диалоги выбора файлов (xdg-desktop-portal-gtk / -gnome) — плавающие
windowrule = float on, center on, size 1000 680, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-gnome)$

# Главное окно на отдельном рабочем столе (по желанию):
# windowrule = workspace 5 silent, match:class ^(io\.github\.zerosensee\.HKTools)$

# --- Hyprland 0.52 и старше (windowrulev2) ---
# windowrulev2 = float, class:^(io\.github\.zerosensee\.HKTools)$, title:^(Битрейт.*|Синхронизация по осциллограмме)$
# windowrulev2 = center, class:^(io\.github\.zerosensee\.HKTools)$, title:^(Битрейт.*|Синхронизация по осциллограмме)$
# windowrulev2 = size 1200 640, class:^(io\.github\.zerosensee\.HKTools)$, title:^(Битрейт.*|Синхронизация по осциллограмме)$
